
name: Build Release APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install -g cordova
      - run: npm install
      - run: cordova platform add android || true
      - name: Create keystore
        run: keytool -genkey -v -keystore camel.keystore -alias camel -keyalg RSA -keysize 2048 -validity 10000 -storepass Camel12345 -keypass Camel12345 -dname "CN=Camel Run, O=Farhad, C=IR"
      - name: Build release
        run: cordova build android --release -- --packageType=apk --keystore=$PWD/camel.keystore --storePassword=Camel12345 --alias=camel --password=Camel12345
      - name: Show files
        run: find platforms -name "*.apk" -o -name "*.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            platforms/android/app/build/outputs/**/*.apk
            camel.keystore
